name: CI
on:
  push: { branches: [main] }
  pull_request:

# The CI only reads the repository; nothing here needs more than that.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Known vulnerabilities in what ships (production dependencies): a new high or critical advisory fails the build, so it is fixed or consciously waived, not found months later.
      - run: pnpm audit --prod --audit-level=high
      # The core suite runs on embedded Postgres and again on a real server (partitions, ltree, pooled-style locking).
      - run: pnpm test
      - run: pnpm --filter @meridian/core test
        env: { TEST_DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres' }
      - name: Generated files are up to date
        run: |
          pnpm --filter @meridian/db embed
          pnpm --filter @meridian/core docs:roles
          git diff --exit-code
      - run: pnpm --filter @meridian/web build
        env:
          MERIDIAN_SUPERUSER_USERNAME: ci-admin
          MERIDIAN_SUPERUSER_PASSWORD: ci-only-Passphrase-123
      # The store-front is a separate deployable: it must build with nothing but its own two server-side variables.
      - run: pnpm --filter @meridian/storefront build
        env:
          MERIDIAN_API_URL: http://localhost:3000/api
          MERIDIAN_API_KEY: mk_test_ciciciciic_ci-only-key-ci-only-key-ci-only-key
