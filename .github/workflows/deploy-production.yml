name: Deploy production

# Production only: no preview deployments are built from branches or pull requests. A push to main that changes the web app (or what it is made of) builds and
# deploys it to Vercel; once the new deployment is live, every older deployment of the project is deleted and only the latest is kept.
# The token is given only to the steps that call Vercel, never to the install. Needs the repository's VERCEL_TOKEN (a secret) and VERCEL_ORG_ID / VERCEL_TEAM_ID / VERCEL_PROJECT_ID (secrets or variables) under Settings → Secrets and variables → Actions.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'services/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - 'scripts/vercel-prune.mjs'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

# One production deploy at a time, in order; a newer push waits for the one running instead of cancelling it half way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID }}
  VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID || secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the Vercel settings are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!v}" ] || { echo "::error::$v is not set under Settings → Secrets and variables → Actions"; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test scripts/vercel-prune.test.mjs
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npm install --global vercel@66.6.0

      # Built here, from the repository root (the project's Root Directory is apps/web), then uploaded as it is: Vercel does not build it again.
      - name: Pull the production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)
          echo "Deployed $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      # Only when the new deployment is READY and has its production alias (it is live): delete the older ones, previews and failed builds included, and keep the latest
      # production deployments to roll back to (KEEP_PRODUCTION_DEPLOYMENTS, default 3: the live one and the two before it; set the variable to 1 to keep only the live one).
      - name: Delete the previous deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          KEEP_PRODUCTION_DEPLOYMENTS: ${{ vars.KEEP_PRODUCTION_DEPLOYMENTS }}
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/vercel-prune.mjs "$DEPLOYED_URL"
