packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# Fixed versions of packages that other packages pull in (their own ranges still allow the vulnerable ones). Remove an entry once the packages that depend on it ask for a fixed version.
overrides:
  postcss: ">=8.5.33"
  multer: ">=2.5.0"
  body-parser: ">=1.20.9"
  qs: ">=6.16.1"
  fast-uri: ">=3.1.9"
  fast-xml-parser: ">=5.12.0"
  file-type: ">=21.3.2"
